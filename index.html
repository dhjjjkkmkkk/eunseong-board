<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FFFCF1"><title>은성고 익명 커뮤니티</title>
<style>
:root{--night:#121418;--slate:#5F6465;--ivory:#E9DEBE;--pearl:#FFFCF1;--line:#e8e0ce;--muted:#918b7e}*{box-sizing:border-box}body{margin:0;background:var(--pearl);color:var(--night);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:680px;margin:auto;min-height:100dvh;padding:0 18px 92px}.top{position:sticky;top:0;background:rgba(255,252,241,.96);backdrop-filter:blur(12px);z-index:5;padding:20px 0 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-family:Georgia,serif;font-size:29px;letter-spacing:-1px;font-weight:700}.sub{font-size:9px;letter-spacing:2px;color:var(--slate);margin-top:2px}.iconbtn{border:0;background:none;color:var(--night);font-size:21px;padding:8px}.notice{margin:18px 0;background:#f4efdf;border-radius:14px;padding:15px}.eyebrow{font-size:10px;letter-spacing:1.6px;color:var(--slate);font-weight:700}.notice strong{display:block;margin-top:7px;font-size:14px}.notice small{color:var(--muted)}.section{margin:24px 0}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:750;font-size:16px}.boards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.board{border:0;text-align:left;background:var(--ivory);border-radius:13px;padding:16px;color:var(--night);min-height:91px}.board .ico{font-size:20px;color:var(--slate)}.board b{display:block;margin-top:10px;font-size:14px}.board small{display:block;color:#777267;margin-top:3px;font-size:11px}.hotitem{background:#f4efdf;border-radius:12px;padding:13px;margin:8px 0;display:flex;gap:12px;align-items:center}.rank{font:700 22px Georgia;color:var(--slate)}.hotitem b{font-size:13px}.hotitem small{display:block;color:var(--slate);font-size:11px;margin-top:4px}.post{padding:15px 0;border-bottom:1px solid var(--line)}.postmeta{display:flex;justify-content:space-between;color:var(--slate);font-size:11px;margin-bottom:8px}.posttitle{font-size:14px;font-weight:700}.excerpt{font-size:12px;color:#777267;margin-top:6px;line-height:1.5}.postfoot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;margin-top:12px}.actions{display:flex;gap:16px}.actions button{border:0;background:none;color:var(--slate);padding:2px}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:5px}.chip{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--slate);border-radius:20px;padding:7px 12px;font-size:11px}.chip.active{background:var(--night);color:var(--pearl);border-color:var(--night)}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,252,241,.97);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding:9px 0 calc(9px + env(safe-area-inset-bottom))}.nav{width:min(680px,100%);display:flex;justify-content:space-around}.nav button{border:0;background:none;color:var(--slate);font-size:10px;display:grid;gap:4px;justify-items:center}.nav button span{font-size:19px}.nav button.active{color:var(--night);font-weight:800}.fab{position:fixed;right:max(22px,calc((100vw - 640px)/2));bottom:83px;background:var(--night);color:var(--pearl);border:0;border-radius:50px;padding:13px 18px;box-shadow:0 5px 18px #12141825}.view{display:none}.view.active{display:block}.panel{background:#f4efdf;border-radius:14px;padding:15px;margin:16px 0}.field{width:100%;border:1px solid var(--line);background:#fffdf7;border-radius:10px;padding:12px;margin:7px 0;color:var(--night)}textarea.field{min-height:150px;resize:vertical}.primary{background:var(--night);color:var(--pearl);border:0;border-radius:10px;padding:12px 16px;font-weight:700}.secondary{background:transparent;border:1px solid var(--slate);color:var(--slate);border-radius:10px;padding:10px 14px}.row{display:flex;gap:8px;align-items:center}.muted{color:var(--muted);font-size:12px}.comment{padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.reply{margin:9px 0 0 18px;color:var(--slate);font-size:12px}.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:13px}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:var(--night);color:white;padding:10px 15px;border-radius:20px;font-size:12px;display:none;z-index:20}.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand">은성고</div><div class="sub">UNSEONG HIGH SCHOOL</div></div><div><button class="iconbtn" onclick="showSearch()" aria-label="검색">⌕</button><button class="iconbtn" onclick="toast('새 알림이 없어요')" aria-label="알림">♧</button></div></header>
<main>
<section id="home" class="view active">
<div class="notice" onclick="openNotice()"><div class="eyebrow">NOTICE　·　공지사항</div><strong id="noticeTitle">은성고 커뮤니티 이용 안내</strong><small id="noticeMeta">관리자 · 필독</small></div>
<div class="section"><div class="sectionhead">게시판 <span class="muted">전체 보기 ›</span></div><div class="boards">
<button class="board" onclick="openBoard('자유게시판')"><span class="ico">▤</span><b>자유게시판</b><small>자유롭게 이야기해요</small></button>
<button class="board" onclick="openBoard('비밀게시판')"><span class="ico">▣</span><b>비밀게시판</b><small>익명으로 털어놓기</small></button>
<button class="board" onclick="openBoard('학교생활')"><span class="ico">⌂</span><b>학교생활</b><small>우리 학교 이야기</small></button>
<button class="board" onclick="openBoard('질문게시판')"><span class="ico">？</span><b>질문게시판</b><small>궁금한 것 물어보기</small></button>
</div></div>
<div class="section"><div class="sectionhead">실시간 인기글 <span class="eyebrow">HOT</span></div><div id="hotList"><div class="empty">게시글을 불러오는 중이에요.</div></div></div>
<div class="section"><div class="sectionhead">최근 게시글 <button class="iconbtn" onclick="loadPosts()">↻</button></div><div id="recentList"></div></div>
</section>
<section id="board" class="view"><div class="sectionhead"><span id="boardTitle">게시판</span><button class="secondary" onclick="showView('home')">홈으로</button></div><div class="filters" id="filters"></div><div id="boardList"></div></section>
<section id="write" class="view"><div class="sectionhead">새 글 작성</div><label class="muted">게시판</label><select id="writeCategory" class="field"><option>자유게시판</option><option>비밀게시판</option><option>학교생활</option><option>질문게시판</option></select><input id="writeTitle" class="field" maxlength="100" placeholder="제목을 입력해 주세요"><textarea id="writeContent" class="field" maxlength="5000" placeholder="은성고 학생들과 나눌 이야기를 적어 주세요"></textarea><div class="row" style="justify-content:space-between"><span class="muted">작성자는 익명으로 표시돼요.</span><button class="primary" onclick="createPost()">익명으로 등록</button></div></section>
<section id="detail" class="view"><button class="secondary" onclick="backToBoard()">← 목록으로</button><div id="detailContent"></div></section>
<section id="scraps" class="view"><div class="sectionhead">스크랩</div><div id="scrapList" class="empty">저장한 글이 여기에 표시돼요.</div></section>
<section id="mypage" class="view"><div class="sectionhead">내 정보</div><div class="panel"><b>익명 이용자</b><p class="muted">은성고 커뮤니티에 오신 것을 환영해요.</p><button class="secondary" onclick="toast('익명으로 이용 중이에요')">계정 상태 확인</button></div><div class="muted">게시글과 댓글은 익명으로 표시됩니다.</div></section>
</main>
</div>
<button class="fab" onclick="showView('write')">＋ 글쓰기</button>
<nav class="bottom"><div class="nav"><button class="active" data-view="home" onclick="showView('home')"><span>⌂</span>홈</button><button data-view="board" onclick="openBoard('전체')"><span>▤</span>게시판</button><button data-view="write" onclick="showView('write')"><span>＋</span>글쓰기</button><button data-view="scraps" onclick="showView('scraps')"><span>♧</span>스크랩</button><button data-view="mypage" onclick="showView('mypage')"><span>○</span>내 정보</button></div></nav><div id="toast" class="toast"></div>
<script>
// Supabase 연결 정보: 공개용 Publishable key만 사용합니다.
const SUPABASE_URL='https://uumeqhqknvrgrscsyoep.supabase.co';
const SUPABASE_KEY='sb_publishable_6KkiY_hsH1KkYL2PynYVXA_9keI_mfg';
let db=null,allPosts=[],currentBoard='전체',currentPost=null,previousView='home';
const categories=['전체','자유게시판','비밀게시판','학교생활','질문게시판'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));document.querySelector('.fab').classList.toggle('hidden',!['home','board'].includes(v));if(v==='scraps')renderScraps();if(v==='home')loadPosts()}
function openBoard(c){currentBoard=c;document.getElementById('boardTitle').textContent=c==='전체'?'전체 게시판':c;document.getElementById('filters').innerHTML=categories.map(x=>`<button class="chip ${x===c?'active':''}" onclick="openBoard('${x}')">${x}</button>`).join('');renderBoard();showView('board')}
function showSearch(){const q=prompt('검색할 단어를 입력해 주세요');if(q===null)return;const found=allPosts.filter(p=>(p.title+' '+p.content).toLowerCase().includes(q.toLowerCase()));document.getElementById('boardTitle').textContent='검색 결과';document.getElementById('filters').innerHTML='';renderList(found,'boardList');showView('board')}
function openNotice(){toast('공지사항 상세 화면은 관리자 공지 연결 후 표시돼요')}
function backToBoard(){openBoard(currentBoard)}
function getLocal(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return []}}
function setLocal(k,v){localStorage.setItem(k,JSON.stringify(v))}
async function init(){try{if(!window.supabase){toast('연결 모듈을 불러오지 못했어요');return}db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);await loadPosts()}catch(e){console.error(e);toast('서버 연결을 확인해 주세요')}}
async function loadPosts(){if(!db){document.getElementById('recentList').innerHTML='<div class="empty">서버 연결을 준비하고 있어요.</div>';return}try{const {data,error}=await db.from('posts').select('*').order('created_at',{ascending:false}).limit(100);if(error)throw error;allPosts=data||[];renderList(allPosts.slice(0,12),'recentList');const hot=[...allPosts].sort((a,b)=>(b.likes_count||0)-(a.likes_count||0)).slice(0,5);document.getElementById('hotList').innerHTML=hot.length?hot.map((p,i)=>`<div class="hotitem" onclick="openPost('${p.id}')"><span class="rank">0${i+1}</span><div><b>${esc(p.title)}</b><small>${esc(p.category||'자유게시판')} · ${p.comments_count||0} 댓글</small></div></div>`).join(''):'<div class="empty">아직 인기글이 없어요.</div>'}catch(e){console.error(e);document.getElementById('recentList').innerHTML='<div class="empty">게시글을 불러오지 못했어요. 데이터베이스 정책과 테이블 구성을 확인해야 해요.</div>';document.getElementById('hotList').innerHTML=''}}
function renderList(list,target){const el=document.getElementById(target);el.innerHTML=list.length?list.map(p=>`<article class="post"><div class="postmeta"><span>${esc(p.category||'자유게시판')}</span><span>${new Date(p.created_at||Date.now()).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</span></div><div class="posttitle" onclick="openPost('${p.id}')">${esc(p.title)}</div><div class="excerpt" onclick="openPost('${p.id}')">${esc((p.content||'').slice(0,100))}</div><div class="postfoot"><span>익명 · 댓글 ${p.comments_count||0}</span><span class="actions"><button onclick="likePost('${p.id}')">♡ ${p.likes_count||0}</button><button onclick="scrapPost('${p.id}')">♧</button></span></div></article>`).join(''):'<div class="empty">아직 게시글이 없어요.</div>'}
function renderBoard(){renderList(currentBoard==='전체'?allPosts:allPosts.filter(p=>p.category===currentBoard),'boardList')}
async function createPost(){const category=document.getElementById('writeCategory').value,title=document.getElementById('writeTitle').value.trim(),content=document.getElementById('writeContent').value.trim();if(!title||!content){toast('제목과 내용을 입력해 주세요');return}if(!db){toast('서버에 연결되지 않았어요');return}try{const {error}=await db.from('posts').insert({category,title,content,is_notice:false});if(error)throw error;document.getElementById('writeTitle').value='';document.getElementById('writeContent').value='';toast('게시글을 등록했어요');await loadPosts();openBoard(category)}catch(e){console.error(e);toast('등록에 실패했어요. 데이터베이스 정책을 확인해 주세요')}}
async function openPost(id){const p=allPosts.find(x=>String(x.id)===String(id));if(!p)return;currentPost=p;previousView=document.querySelector('.view.active').id;const {data:comments,error}=await db.from('comments').select('*').eq('post_id',id).order('created_at',{ascending:true});const cs=error?[]:(comments||[]);document.getElementById('detailContent').innerHTML=`<div class="postmeta" style="margin-top:18px"><span>${esc(p.category||'자유게시판')}</span><span>익명</span></div><h2 style="font-size:20px">${esc(p.title)}</h2><p style="white-space:pre-wrap;line-height:1.8;font-size:14px">${esc(p.content)}</p><div class="row" style="margin:18px 0"><button class="secondary" onclick="likePost('${p.id}')">♡ 좋아요 ${p.likes_count||0}</button><button class="secondary" onclick="scrapPost('${p.id}')">♧ 스크랩</button></div><hr style="border:0;border-top:1px solid var(--line)"><b>댓글 ${cs.length}</b><div id="comments">${cs.map(c=>`<div class="comment">익명　${esc(c.content)}</div>`).join('')}</div><textarea id="commentText" class="field" rows="2" placeholder="댓글을 남겨 주세요"></textarea><button class="primary" onclick="createComment('${p.id}')">댓글 등록</button>`;showView('detail')}
async function createComment(id){const content=document.getElementById('commentText').value.trim();if(!content)return toast('댓글 내용을 입력해 주세요');try{const {error}=await db.from('comments').insert({post_id:id,content});if(error)throw error;toast('댓글을 등록했어요');await openPost(id)}catch(e){console.error(e);toast('댓글 등록에 실패했어요')}}
async function likePost(id){toast('좋아요 저장 기능은 사용자별 식별 설정 후 활성화돼요')}
function scrapPost(id){const a=getLocal('eunseong_scraps');if(a.includes(String(id))){setLocal('eunseong_scraps',a.filter(x=>x!==String(id)));toast('스크랩을 해제했어요')}else{a.push(String(id));setLocal('eunseong_scraps',a);toast('스크랩했어요')} }
function renderScraps(){const ids=getLocal('eunseong_scraps');renderList(allPosts.filter(p=>ids.includes(String(p.id))),'scrapList')}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.addEventListener('load', () => {
  if (window.supabase) {
    init();
  } else {
    toast('연결 모듈을 불러오지 못했어요. 새로고침해 주세요.');
  }
});
</script>
</body>
</html>
